# Configuración del bot de ofertas de pádel.
# Las variables ${VAR} se sustituyen por variables de entorno al cargar.

filtros:
  categorias: [pala, zapatilla]          # vacío = todas
  marcas: [Bullpadel, Nox, Adidas, Siux, Babolat, Head]   # vacío = todas
  precio_max: 200
  descuento_min_pct: 30                   # regla "descuento alto" (precio tachado)
  bajada_historica_min_pct: 10            # regla "bajada real" frente al mínimo propio
  diferencia_min_eur_entre_tiendas: 15    # regla "mejor precio entre tiendas" (mismo EAN)

seguimiento:            # productos concretos que quiero vigilar (ignoran los filtros)
  - "Nox AT10"
  - "Bullpadel Vertex 04"

notificaciones:
  telegram_chat_id: ${TELEGRAM_CHAT_ID}
  resumen_diario: true

scraping:
  user_agent: "PadelOfertasBot/0.1 (+mailto:ruizristo@gmail.com)"
  delay_segundos: 2.5          # mínimo entre peticiones al mismo dominio
  timeout_segundos: 20
  ruta_db: data/padel.db
  max_ejecuciones_vacias: 3    # aviso si una tienda devuelve 0 productos N veces seguidas

# Fase 1: verificar plataforma de cada tienda (python -m padel_bot.investigar)
