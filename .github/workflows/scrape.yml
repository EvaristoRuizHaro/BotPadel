name: Scrape ofertas

on:
  schedule:
    # Dos revisiones al día. GitHub usa UTC: 7:13 y 18:13 UTC = 9:13 y 20:13 en Madrid
    # en horario de verano (8:13 y 19:13 en invierno).
    - cron: "13 7,18 * * *"
  push:
    # Cada push a main (o a "lanzar") lanza una revisión al momento.
    # La rama "data" queda fuera: si no, el propio bot se relanzaría al guardar la base.
    branches: [main, lanzar]
  workflow_dispatch:
    inputs:
      comando:
        description: "scrape o resumen"
        default: scrape

permissions:
  contents: write   # para guardar la base de datos en la rama "data"

concurrency:
  group: padel-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install .

      - name: Recuperar base de datos (rama data)
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:padel.db > data/padel.db
          fi

      - name: Ejecutar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -m padel_bot.main ${{ inputs.comando || 'scrape' }}

      - name: Guardar base de datos (rama data)
        if: always()
        run: |
          [ -f data/padel.db ] || exit 0
          git config user.name "padel-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/padel.db /tmp/padel.db
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add /tmp/rama-data FETCH_HEAD
            cd /tmp/rama-data && git checkout -B data
          else
            git worktree add --orphan -b data /tmp/rama-data
            cd /tmp/rama-data
          fi
          cp /tmp/padel.db padel.db
          git add padel.db
          git commit -m "datos $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push origin data
